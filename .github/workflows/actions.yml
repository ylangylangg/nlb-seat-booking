name: run booking script

on:
  schedule:
    - cron: '55 3 * * *' # Every day at 11:55 am Singapore time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book-seat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # checkout the repository content to github runner

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run booking script
        env:
          NLB_USERNAME: ${{ secrets.NLB_USERNAME }}
          NLB_PASSWORD: ${{ secrets.NLB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "1"
        run: python -u main.py